<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rappi Árabe | Sistema Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Pantalla de carga inicial */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c1a 0%, #1a0f0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.6s ease;
        }

        .logo-container {
            text-align: center;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo-container h1 {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FF8C00, #FF4500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,140,0,0.3);
        }

        .logo-sub {
            color: #FFD700;
            font-weight: 500;
            letter-spacing: 3px;
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .dots-loader {
            display: flex;
            gap: 14px;
            margin: 40px 0 50px;
        }

        .dots-loader span {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dots-loader span:nth-child(2) { animation-delay: 0.15s; background: #FF8C00; }
        .dots-loader span:nth-child(3) { animation-delay: 0.3s; background: #FF4500; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
            40% { transform: scale(1.2); opacity: 1; }
        }

        /* Botón deslizante */
        .slide-btn-wrapper {
            width: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 70px;
            padding: 5px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,215,0,0.4);
            cursor: pointer;
        }

        .slide-btn {
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            font-weight: 800;
            color: #1a1a2e;
            user-select: none;
        }

        /* Panel principal */
        .mesero-panel {
            display: none;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d3 100%);
            padding-bottom: 85px;
        }

        /* HEADER COMPACTO CON EFECTO GLASS Y PUNTAS INFERIORES CIRCULARES */
        .header-glass {
            background: rgba(30, 58, 47, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px 20px;
            color: white;
            border-radius: 0 0 32px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,215,0,0.3);
        }

        .header-glass h2 {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* Selector de mesa DROPDOWN + cliente compacto */
        .selector-compact {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .mesa-dropdown-glass {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.4);
            padding: 12px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
        }

        .mesa-dropdown-glass option {
            background: #1e3a2f;
            color: white;
        }

        .cliente-input-glass {
            flex: 2;
            min-width: 170px;
        }

        .cliente-input-glass input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: none;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 0.9rem;
        }

        .cliente-input-glass input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        /* Menú con efecto glass */
        .menu-scroll {
            padding: 20px 16px;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
        }

        .categoria-tag {
            font-size: 1.2rem;
            font-weight: 800;
            background: rgba(255,232,197,0.9);
            backdrop-filter: blur(10px);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 40px;
            margin-bottom: 14px;
            color: #4a2e1a;
        }

        .item-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,226,181,0.5);
            transition: all 0.2s;
        }

        .item-card:active {
            transform: scale(0.98);
        }

        .item-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #2c1810;
        }

        .precio {
            color: #e67e22;
            font-weight: 800;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .add-btn {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* BARRA INFERIOR FIJA CON EFECTO GLASS */
        .bottom-bar-glass {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 42, 34, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 28px 28px 0 0;
            padding: 14px 20px 20px;
            color: white;
            z-index: 100;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,215,0,0.3);
        }

        /* Botón deslizable para enviar */
        .send-slide-container {
            background: rgba(255,255,255,0.15);
            border-radius: 60px;
            padding: 4px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .send-slide-track {
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 22px;
            font-weight: 800;
            color: #1a2a22;
            user-select: none;
            transition: transform 0.05s linear;
        }

        /* Botón flecha */
        .arrow-toggle-glass {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            color: #FFD700;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .arrow-toggle-glass:active {
            transform: scale(0.97);
        }

        /* Panel carrito que se despliega hacia arriba con glass */
        .cart-slide-glass {
            position: fixed;
            bottom: 85px;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 28px 28px 0 0;
            padding: 20px;
            max-height: 55vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 99;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
            border-top: 2px solid #FFD700;
        }

        .cart-slide-glass.open {
            transform: translateY(0);
        }

        .cart-header-glass {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #1a2a22;
            padding-bottom: 8px;
            border-bottom: 2px solid #FFD700;
        }

        .cart-items-list {
            max-height: 240px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .cart-item-row {
            background: rgba(245,243,240,0.8);
            border-radius: 20px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cart-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cart-controls button {
            background: #FFB347;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            color: #1a2a22;
        }

        .cart-controls button:last-child {
            background: #c0392b;
            color: white;
        }

        .total-glass {
            font-size: 1.5rem;
            font-weight: 900;
            text-align: right;
            border-top: 2px solid #FFD700;
            padding-top: 12px;
            margin-top: 8px;
            color: #e67e22;
        }

        /* Modales con efecto glass */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-card-glass {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 24px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            animation: modalPop 0.3s ease;
            border: 1px solid rgba(255,215,0,0.5);
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card-glass h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1e3a2f;
        }

        .opcion-acompanante {
            background: rgba(240,237,232,0.9);
            padding: 14px;
            margin: 12px 0;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
            color: #2c1810;
        }

        /* Mensaje éxito estilo Didi */
        .success-didi {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px);
            color: white;
            padding: 24px 36px;
            border-radius: 60px;
            text-align: center;
            z-index: 4000;
            animation: successAnim 0.3s ease;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.5);
        }

        @keyframes successAnim {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .toast-msg {
            position: fixed;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: rgba(46,204,113,0.95);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 60px;
            z-index: 3500;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Pantalla inicial -->
<div class="loading-screen" id="loadingScreen">
    <div class="logo-container">
        <h1>🍢 RAPPI ÁRABE</h1>
        <div class="logo-sub">COCINA DE AUTOR · SABORES DEL MEDITERRÁNEO</div>
    </div>
    <div class="dots-loader">
        <span></span><span></span><span></span>
    </div>
    <div class="slide-btn-wrapper" id="entrySlide">
        <div class="slide-btn">
            <span>DESLIZA PARA INGRESAR →</span>
            <span>➡️</span>
        </div>
    </div>
</div>

<!-- Panel Mesero -->
<div class="mesero-panel" id="meseroPanel">
    <!-- HEADER COMPACTO CON EFECTO GLASS -->
    <div class="header-glass">
        <h2>🧾 RAPPI ÁRABE</h2>
        <div class="selector-compact">
            <select id="mesaSelect" class="mesa-dropdown-glass">
                <option value="1">📌 Mesa 1</option>
                <option value="2">📌 Mesa 2</option>
                <option value="3">📌 Mesa 3</option>
                <option value="4">📌 Mesa 4</option>
                <option value="5">📌 Mesa 5</option>
                <option value="6">📌 Mesa 6</option>
            </select>
            <div class="cliente-input-glass">
                <input type="text" id="nombreCliente" placeholder="👤 Nombre del cliente" autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Menú -->
    <div class="menu-scroll" id="menuContainer"></div>

    <!-- BARRA INFERIOR FIJA CON EFECTO GLASS -->
    <div class="bottom-bar-glass">
        <div class="send-slide-container" id="sendSlideWrapper">
            <div class="send-slide-track" id="sendSlideTrack">
                <span>📨 DESLIZA PARA ENVIAR →</span>
                <span>👉</span>
            </div>
        </div>
        <button class="arrow-toggle-glass" id="arrowToggleBtn">
            <span>⬆️</span> VER PEDIDO ACTUAL <span>⬆️</span>
        </button>
    </div>

    <!-- Panel carrito que se despliega hacia arriba -->
    <div class="cart-slide-glass" id="cartSlidePanel">
        <div class="cart-header-glass">
            <span>🛒 PEDIDO</span>
            <span id="mesaBadge" style="background:#FFD700; padding:4px 12px; border-radius:20px; color:#1a2a22;">Mesa 1</span>
        </div>
        <div id="cartItemsList" class="cart-items-list"></div>
        <div class="total-glass" id="totalCOP">$0 COP</div>
    </div>
</div>

<!-- Modal acompañante para pinchos -->
<div class="modal-overlay" id="modalAcompanante">
    <div class="modal-card-glass">
        <h3>🍢 ¿CON QUÉ LO QUIERES?</h3>
        <div class="opcion-acompanante" data-acompanante="papas">🍟 Papas Francesas</div>
        <div class="opcion-acompanante" data-acompanante="tahine">🥙 Tahine + Pan Árabe</div>
    </div>
</div>

<!-- Modal encargadas -->
<div class="modal-overlay" id="modalEncargada">
    <div class="modal-card-glass">
        <h3>👩‍🍳 ¿QUIÉN ATIENDE?</h3>
        <div class="opcion-acompanante" data-encargada="Paula">👩🏻 PAULA</div>
        <div class="opcion-acompanante" data-encargada="Cindy">👩🏽 CINDY</div>
    </div>
</div>

<script>
    // CONFIGURACIÓN TELEGRAM
    const TELEGRAM_BOT_TOKEN = "8985589315:AAEnWzP5f2YwSI7dW_gylgtI4pHDZVnkMD8";
    const TELEGRAM_CHAT_ID = "7806030847";

    // MENÚ COMPLETO
    const menuData = {
        "PLATOS PRINCIPALES": [
            { nombre: "Quibbe", precio: 3000 },
            { nombre: "Combo Quibbe", precio: 12000 },
            { nombre: "Combo Deditos", precio: 12000 },
            { nombre: "Combo Carimañolas", precio: 12000 },
            { nombre: "Bandeja de Quibbe", precio: 26000 },
            { nombre: "Trio Rapiárabe", precio: 30000 }
        ],
        "ESPECIALIDADES": [
            { nombre: "Tahine Especial", precio: 18000 },
            { nombre: "Tahine Especial de Pollo", precio: 16000 },
            { nombre: "Tahine TOGO", precio: 10000 }
        ],
        "PINCHOS": [
            { nombre: "Pincho de Pollo", precio: 22000 },
            { nombre: "Pincho de Lomo Fino", precio: 28000 },
            { nombre: "Pincho de Bondiola de Cerdo", precio: 25000 },
            { nombre: "Pincho Mixto", precio: 26000 }
        ],
        "CONGELADOS": [
            { nombre: "Paquete de Quibbe Congelado", precio: 20000 },
            { nombre: "Bandeja de Deditos de Queso Congelado", precio: 15000 },
            { nombre: "Bandeja de Carimañola Congelado", precio: 15000 }
        ]
    };

    // Estado
    let orders = {};
    for (let i = 1; i <= 6; i++) orders[i] = { items: {}, cliente: "" };
    let currentMesa = 1;
    let pendingPincho = null;

    // Render menú
    function renderMenu() {
        const container = document.getElementById("menuContainer");
        let html = "";
        for (let [cat, items] of Object.entries(menuData)) {
            html += `<div><div class="categoria-tag">${cat}</div>`;
            items.forEach(item => {
                html += `
                    <div class="item-card">
                        <div class="item-info">
                            <h4>${item.nombre}</h4>
                            <div class="precio">$${item.precio.toLocaleString()} COP</div>
                        </div>
                        <div class="add-btn" data-nombre="${item.nombre}" data-precio="${item.precio}" data-categoria="${cat}">+</div>
                    </div>
                `;
            });
            html += `</div>`;
        }
        container.innerHTML = html;
        
        document.querySelectorAll(".add-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const nombre = btn.dataset.nombre;
                const precio = parseInt(btn.dataset.precio);
                const categoria = btn.dataset.categoria;
                
                if (categoria === "PINCHOS") {
                    pendingPincho = { nombre, precio };
                    document.getElementById("modalAcompanante").style.display = "flex";
                } else {
                    agregarProducto(nombre, precio, null);
                }
            });
        });
    }

    function agregarProducto(nombre, precio, acompanante) {
        let nombreFinal = nombre;
        if (acompanante) {
            nombreFinal = `${nombre} + ${acompanante === 'papas' ? '🍟 Papas Francesas' : '🥙 Tahine + Pan Árabe'}`;
        }
        if (!orders[currentMesa].items[nombreFinal]) {
            orders[currentMesa].items[nombreFinal] = { cantidad: 0, precio: precio };
        }
        orders[currentMesa].items[nombreFinal].cantidad++;
        if (document.getElementById("nombreCliente").value.trim()) {
            orders[currentMesa].cliente = document.getElementById("nombreCliente").value.trim();
        }
        renderCart();
        mostrarToast(`✅ ${nombreFinal} agregado`, "#2ecc71");
    }

    function renderCart() {
        const cartDiv = document.getElementById("cartItemsList");
        const totalSpan = document.getElementById("totalCOP");
        const mesaBadge = document.getElementById("mesaBadge");
        mesaBadge.innerText = `Mesa ${currentMesa}`;
        
        const items = orders[currentMesa].items;
        if (Object.keys(items).length === 0) {
            cartDiv.innerHTML = '<div style="text-align:center;opacity:0.6; padding:20px;">Sin productos</div>';
            totalSpan.innerText = "$0 COP";
            return;
        }
        
        let total = 0;
        let html = "";
        for (let [nombre, det] of Object.entries(items)) {
            const subtotal = det.cantidad * det.precio;
            total += subtotal;
            html += `
                <div class="cart-item-row">
                    <span style="flex:2; font-size:0.8rem;">${nombre} x${det.cantidad}</span>
                    <div class="cart-controls">
                        <button data-nombre="${nombre}" data-op="sumar">+</button>
                        <button data-nombre="${nombre}" data-op="restar">-</button>
                        <button data-nombre="${nombre}" data-op="eliminar">🗑️</button>
                    </div>
                    <span>$${subtotal.toLocaleString()}</span>
                </div>
            `;
        }
        cartDiv.innerHTML = html;
        totalSpan.innerText = `$${total.toLocaleString()} COP`;

        document.querySelectorAll(".cart-controls button").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const nombre = btn.dataset.nombre;
                const op = btn.dataset.op;
                if (op === "sumar") orders[currentMesa].items[nombre].cantidad++;
                else if (op === "restar") {
                    if (orders[currentMesa].items[nombre].cantidad > 1) orders[currentMesa].items[nombre].cantidad--;
                    else delete orders[currentMesa].items[nombre];
                } else if (op === "eliminar") delete orders[currentMesa].items[nombre];
                renderCart();
            });
        });
    }

    async function enviarATelegram(mensaje) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: mensaje, parse_mode: 'Markdown' })
            });
            const data = await res.json();
            return data.ok;
        } catch (e) {
            return false;
        }
    }

    function mostrarExitoDidi() {
        const div = document.createElement("div");
        div.className = "success-didi";
        div.innerHTML = "✅ ¡PEDIDO ENVIADO!<br><span style='font-size:0.8rem;'>Cocina en preparación</span>";
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2500);
    }

    function mostrarToast(msg, color) {
        const toast = document.createElement("div");
        toast.className = "toast-msg";
        toast.innerText = msg;
        toast.style.background = color;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function enviarPedidoConEncargada(encargada) {
        const pedido = orders[currentMesa];
        let detalle = "";
        let total = 0;
        for (let [nom, det] of Object.entries(pedido.items)) {
            const subtotal = det.cantidad * det.precio;
            total += subtotal;
            detalle += `🍽️ *${nom}* x${det.cantidad} = $${subtotal.toLocaleString()} COP\n`;
        }
        
        const mensaje = `🧾 *NUEVO PEDIDO RAPPI ÁRABE*\n━━━━━━━━━━━━━━━━━━━━━\n👩‍🍳 *Encargada:* ${encargada}\n👤 *Cliente:* ${pedido.cliente}\n🪑 *Mesa:* ${currentMesa}\n⏰ *Hora:* ${new Date().toLocaleTimeString()}\n\n📋 *DETALLE:*\n${detalle}\n━━━━━━━━━━━━━━━━━━━━━\n💰 *TOTAL:* $${total.toLocaleString()} COP\n✅ *Estado:* En preparación`;

        // Mostrar dots loading 3.5s
        const loader = document.createElement("div");
        loader.style.position = "fixed";
        loader.style.top = "0";
        loader.style.left = "0";
        loader.style.width = "100%";
        loader.style.height = "100%";
        loader.style.background = "rgba(0,0,0,0.85)";
        loader.style.backdropFilter = "blur(8px)";
        loader.style.display = "flex";
        loader.style.flexDirection = "column";
        loader.style.alignItems = "center";
        loader.style.justifyContent = "center";
        loader.style.zIndex = "4000";
        loader.innerHTML = `
            <div style="background:#1e3a2f; border-radius: 60px; padding: 40px; text-align:center;">
                <div style="font-size: 3rem;">🍢</div>
                <div class="dots-loader" style="margin: 20px 0;"><span></span><span></span><span></span></div>
                <p style="color:white; font-weight:bold;">Enviando a cocina...</p>
            </div>
        `;
        document.body.appendChild(loader);
        
        setTimeout(async () => {
            const exito = await enviarATelegram(mensaje);
            loader.remove();
            if (exito) {
                mostrarExitoDidi();
                // Limpiar pedido actual
                orders[currentMesa] = { items: {}, cliente: pedido.cliente };
                document.getElementById("nombreCliente").value = pedido.cliente;
                renderCart();
                // Cerrar panel carrito
                document.getElementById("cartSlidePanel").classList.remove("open");
                document.getElementById("arrowToggleBtn").innerHTML = "<span>⬆️</span> VER PEDIDO ACTUAL <span>⬆️</span>";
            } else {
                mostrarToast("❌ Error al enviar a Telegram", "#e74c3c");
            }
        }, 3500);
    }

    // Inicializar
    function init() {
        renderMenu();
        renderCart();
        
        const mesaSelect = document.getElementById("mesaSelect");
        mesaSelect.addEventListener("change", (e) => {
            orders[currentMesa].cliente = document.getElementById("nombreCliente").value;
            currentMesa = parseInt(e.target.value);
            document.getElementById("nombreCliente").value = orders[currentMesa].cliente || "";
            renderCart();
            document.getElementById("mesaBadge").innerText = `Mesa ${currentMesa}`;
        });
        
        document.getElementById("nombreCliente").addEventListener("input", (e) => {
            orders[currentMesa].cliente = e.target.value;
        });
        
        // Flecha toggle carrito
        const arrowBtn = document.getElementById("arrowToggleBtn");
        const cartPanel = document.getElementById("cartSlidePanel");
        arrowBtn.addEventListener("click", () => {
            cartPanel.classList.toggle("open");
            arrowBtn.innerHTML = cartPanel.classList.contains("open") 
                ? "<span>⬇️</span> OCULTAR PEDIDO <span>⬇️</span>" 
                : "<span>⬆️</span> VER PEDIDO ACTUAL <span>⬆️</span>";
        });
        
        // Botón deslizable enviar
        const sendWrapper = document.getElementById("sendSlideWrapper");
        const sendTrack = document.getElementById("sendSlideTrack");
        let startX = 0, isDragging = false;
        
        const resetSlide = () => { sendTrack.style.transform = "translateX(0)"; };
        
        const handleMove = (clientX) => {
            if (!isDragging) return;
            const diff = clientX - startX;
            if (diff > 80) {
                isDragging = false;
                resetSlide();
                const pedido = orders[currentMesa];
                if (Object.keys(pedido.items).length === 0) {
                    mostrarToast("⚠️ Agrega productos primero", "#e67e22");
                    return;
                }
                if (!pedido.cliente.trim()) {
                    mostrarToast("✏️ Ingresa el nombre del cliente", "#e67e22");
                    return;
                }
                document.getElementById("modalEncargada").style.display = "flex";
            } else if (diff > 0) {
                sendTrack.style.transform = `translateX(${Math.min(diff, 80)}px)`;
            }
        };
        
        sendWrapper.addEventListener("mousedown", (e) => { startX = e.clientX; isDragging = true; e.preventDefault(); });
        sendWrapper.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; isDragging = true; });
        window.addEventListener("mousemove", (e) => { if (isDragging) handleMove(e.clientX); });
        window.addEventListener("touchmove", (e) => { if (isDragging) handleMove(e.touches[0].clientX); });
        window.addEventListener("mouseup", () => { if (isDragging) resetSlide(); isDragging = false; });
        window.addEventListener("touchend", () => { if (isDragging) resetSlide(); isDragging = false; });
        
        // Modal encargadas
        const modalEnc = document.getElementById("modalEncargada");
        document.querySelectorAll("#modalEncargada .opcion-acompanante").forEach(opt => {
            opt.addEventListener("click", () => {
                modalEnc.style.display = "none";
                enviarPedidoConEncargada(opt.dataset.encargada);
            });
        });
        modalEnc.addEventListener("click", (e) => { if (e.target === modalEnc) modalEnc.style.display = "none"; });
        
        // Modal acompañante
        const modalAcomp = document.getElementById("modalAcompanante");
        document.querySelectorAll("#modalAcompanante .opcion-acompanante").forEach(opt => {
            opt.addEventListener("click", () => {
                modalAcomp.style.display = "none";
                if (pendingPincho) {
                    agregarProducto(pendingPincho.nombre, pendingPincho.precio, opt.dataset.acompanante);
                    pendingPincho = null;
                }
            });
        });
        modalAcomp.addEventListener("click", (e) => { if (e.target === modalAcomp) { modalAcomp.style.display = "none"; pendingPincho = null; } });
    }
    
    // Entrada deslizante
    function initEntrySlide() {
        const wrapper = document.getElementById("entrySlide");
        let startX = 0, isDragging = false;
        const onMove = (e) => {
            if (!isDragging) return;
            const diff = (e.clientX || e.touches[0].clientX) - startX;
            if (diff > 70) {
                isDragging = false;
                document.getElementById("loadingScreen").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("loadingScreen").style.display = "none";
                    document.getElementById("meseroPanel").style.display = "block";
                    init();
                }, 400);
            }
        };
        wrapper.addEventListener("mousedown", (e) => { startX = e.clientX; isDragging = true; });
        wrapper.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; isDragging = true; });
        window.addEventListener("mousemove", onMove);
        window.addEventListener("touchmove", onMove);
        window.addEventListener("mouseup", () => isDragging = false);
        window.addEventListener("touchend", () => isDragging = false);
    }
    
    initEntrySlide();
</script>
</body>
</html>
