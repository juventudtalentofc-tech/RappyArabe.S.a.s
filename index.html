<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rappi Árabe | Sistema Profesional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
            background: #f5f3f0;
            overflow-x: hidden;
        }

        /* Pantalla de carga inicial */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1a 0%, #0d1b14 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.6s ease;
        }

        .logo-container {
            text-align: center;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo-container h1 {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FF8C00, #FF4500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,140,0,0.3);
        }

        .logo-sub {
            color: #FFD700;
            font-weight: 500;
            letter-spacing: 3px;
            font-size: 0.8rem;
            margin-top: 8px;
        }

        .dots-loader {
            display: flex;
            gap: 14px;
            margin: 40px 0 50px;
        }

        .dots-loader span {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dots-loader span:nth-child(2) { animation-delay: 0.15s; background: #FF8C00; }
        .dots-loader span:nth-child(3) { animation-delay: 0.3s; background: #FF4500; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
            40% { transform: scale(1.3); opacity: 1; }
        }

        /* Botón deslizante */
        .slide-btn-wrapper {
            width: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 70px;
            padding: 5px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,215,0,0.4);
            cursor: pointer;
        }

        .slide-btn {
            background: linear-gradient(90deg, #FFB347, #FF8C00);
            border-radius: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            font-weight: 800;
            color: #1a1a2e;
            user-select: none;
        }

        /* Panel principal */
        .mesero-panel {
            display: none;
            min-height: 100vh;
            background: #fef9ef;
        }

        /* HEADER FIJO */
        .header-fixed {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #1e3a2f 0%, #0f281f 100%);
            padding: 18px 20px;
            color: white;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* Selector de mesa compacto */
        .mesa-selector-compact {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .mesa-selector-compact label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .mesa-dropdown {
            background: #2b4a38;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            flex: 1;
            max-width: 140px;
        }

        .cliente-input-compact {
            flex: 2;
            min-width: 160px;
        }

        .cliente-input-compact input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 40px;
            border: none;
            background: #fff8f0;
            font-size: 0.9rem;
        }

        /* Botón toggle carrito */
        .toggle-cart-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #1a2a22;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 150;
            transition: transform 0.2s;
        }

        .toggle-cart-btn:active {
            transform: scale(0.95);
        }

        /* Carrito oculto por defecto */
        .cart-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a2a22;
            border-radius: 32px 32px 0 0;
            padding: 18px 20px 28px;
            color: white;
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 70vh;
            overflow-y: auto;
        }

        .cart-bottom.open {
            transform: translateY(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .cart-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .cart-item-row {
            background: #2d3f36;
            border-radius: 30px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cart-controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cart-controls-group button {
            background: #FFB347;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .total-grande {
            font-size: 1.6rem;
            font-weight: 900;
            text-align: right;
            border-top: 2px solid #FFB347;
            padding-top: 10px;
            margin-top: 8px;
        }

        .send-slide-btn {
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: 800;
            color: #1a2a22;
        }

        /* Menú scroll */
        .menu-scroll {
            padding: 20px 16px;
            padding-bottom: 100px;
        }

        .categoria-tag {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE8C5, #FFD8A0);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 40px;
            margin-bottom: 14px;
            color: #4a2e1a;
        }

        .item-card {
            background: white;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #ffe2b5;
        }

        .item-info h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .precio {
            color: #e67e22;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .add-btn {
            background: linear-gradient(135deg, #FFB347, #FF8C00);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        /* Modal para acompañantes de pinchos */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: white;
            border-radius: 48px;
            padding: 28px 20px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1e3a2f;
        }

        .opcion-acompanante {
            background: #f0ede8;
            padding: 14px;
            margin: 10px 0;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
        }

        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 60px;
            z-index: 3500;
            font-weight: bold;
            animation: fadeUp 0.3s;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge-pedido {
            background: #FFB347;
            color: #1a2a22;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Pantalla inicial -->
<div class="loading-screen" id="loadingScreen">
    <div class="logo-container">
        <h1>🍢 RAPPI ÁRABE</h1>
        <div class="logo-sub">COCINA DE AUTOR · SABORES DEL MEDITERRÁNEO</div>
    </div>
    <div class="dots-loader">
        <span></span><span></span><span></span>
    </div>
    <div class="slide-btn-wrapper" id="entrySlide">
        <div class="slide-btn">
            <span>DESLIZA PARA INGRESAR →</span>
            <span>➡️</span>
        </div>
    </div>
</div>

<!-- Panel Mesero -->
<div class="mesero-panel" id="meseroPanel">
    <!-- HEADER FIJO COMPACTO -->
    <div class="header-fixed">
        <div class="header-title">
            🧾 RAPPI ÁRABE
        </div>
        <div class="mesa-selector-compact">
            <label>📌 Mesa:</label>
            <select id="mesaSelect" class="mesa-dropdown">
                <option value="1">Mesa 1</option>
                <option value="2">Mesa 2</option>
                <option value="3">Mesa 3</option>
                <option value="4">Mesa 4</option>
                <option value="5">Mesa 5</option>
                <option value="6">Mesa 6</option>
            </select>
            <div class="cliente-input-compact">
                <input type="text" id="nombreCliente" placeholder="👤 Nombre del cliente" autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Menú de productos -->
    <div class="menu-scroll" id="menuContainer"></div>

    <!-- Botón flotante para abrir carrito -->
    <div class="toggle-cart-btn" id="toggleCartBtn">
        🛒
    </div>

    <!-- Carrito oculto inicialmente -->
    <div class="cart-bottom" id="cartPanel">
        <div class="cart-header">
            <span>🛒 PEDIDO</span>
            <span id="mesaBadge" class="badge-pedido">Mesa 1</span>
        </div>
        <div id="cartItemsList" class="cart-items"></div>
        <div class="total-grande" id="totalCOP">$0 COP</div>
        <div class="send-slide-btn" id="sendOrderTrigger">
            <span>📨 ENVIAR PEDIDO →</span>
            <span>👉</span>
        </div>
    </div>
</div>

<!-- Modal para acompañantes de pinchos -->
<div class="modal-overlay" id="modalAcompanante">
    <div class="modal-card">
        <h3>🍟 ¿CON QUÉ LO QUIERES?</h3>
        <div class="opcion-acompanante" data-acompanante="papas">🍟 Papas Francesas</div>
        <div class="opcion-acompanante" data-acompanante="tahine">🥙 Tahine + Pan Árabe</div>
    </div>
</div>

<script>
    // CONFIGURACIÓN TELEGRAM
    const TELEGRAM_BOT_TOKEN = "8985589315:AAEnWzP5f2YwSI7dW_gylgtI4pHDZVnkMD8";
    const TELEGRAM_CHAT_ID = "7806030847";

    // MENÚ COMPLETO
    const menuData = {
        "PLATOS PRINCIPALES": [
            { nombre: "Quibbe", precio: 3000 },
            { nombre: "Combo Quibbe", precio: 12000 },
            { nombre: "Combo Deditos", precio: 12000 },
            { nombre: "Combo Carimañolas", precio: 12000 },
            { nombre: "Bandeja de Quibbe", precio: 26000 },
            { nombre: "Trio Rapiárabe", precio: 30000 }
        ],
        "ESPECIALIDADES": [
            { nombre: "Tahine Especial", precio: 18000 },
            { nombre: "Tahine Especial de Pollo", precio: 16000 },
            { nombre: "Tahine TOGO", precio: 10000 }
        ],
        "PINCHOS": [
            { nombre: "Pincho de Pollo", precio: 22000 },
            { nombre: "Pincho de Lomo Fino", precio: 28000 },
            { nombre: "Pincho de Bondiola de Cerdo", precio: 25000 },
            { nombre: "Pincho Mixto", precio: 26000 }
        ],
        "CONGELADOS": [
            { nombre: "Paquete de Quibbe Congelado", precio: 20000 },
            { nombre: "Bandeja de Deditos de Queso Congelado", precio: 15000 },
            { nombre: "Bandeja de Carimañola Congelado", precio: 15000 }
        ]
    };

    // Estado
    let orders = {};
    for (let i = 1; i <= 6; i++) orders[i] = { items: {}, cliente: "" };
    let currentMesa = 1;
    let pendingPincho = null; // almacena temporal el pincho seleccionado

    // Render del menú
    function renderMenu() {
        const container = document.getElementById("menuContainer");
        let html = "";
        for (let [cat, items] of Object.entries(menuData)) {
            html += `<div><div class="categoria-tag">${cat}</div>`;
            items.forEach(item => {
                html += `
                    <div class="item-card">
                        <div class="item-info">
                            <h4>${item.nombre}</h4>
                            <div class="precio">$${item.precio.toLocaleString()} COP</div>
                        </div>
                        <div class="add-btn" data-nombre="${item.nombre}" data-precio="${item.precio}" data-categoria="${cat}">+</div>
                    </div>
                `;
            });
            html += `</div>`;
        }
        container.innerHTML = html;
        
        document.querySelectorAll(".add-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const nombre = btn.dataset.nombre;
                const precio = parseInt(btn.dataset.precio);
                const categoria = btn.dataset.categoria;
                
                // Si es pincho, mostrar modal de acompañante
                if (categoria === "PINCHOS") {
                    pendingPincho = { nombre, precio };
                    document.getElementById("modalAcompanante").style.display = "flex";
                } else {
                    agregarProducto(nombre, precio, null);
                }
            });
        });
    }

    function agregarProducto(nombre, precio, acompanante) {
        let nombreFinal = nombre;
        if (acompanante) {
            nombreFinal = `${nombre} + ${acompanante === 'papas' ? '🍟 Papas Francesas' : '🥙 Tahine + Pan Árabe'}`;
        }
        if (!orders[currentMesa].items[nombreFinal]) {
            orders[currentMesa].items[nombreFinal] = { cantidad: 0, precio: precio };
        }
        orders[currentMesa].items[nombreFinal].cantidad++;
        if (document.getElementById("nombreCliente").value.trim()) {
            orders[currentMesa].cliente = document.getElementById("nombreCliente").value.trim();
        }
        renderCart();
        mostrarToast(`✅ ${nombreFinal} agregado`, "#2ecc71");
    }

    function renderCart() {
        const cartDiv = document.getElementById("cartItemsList");
        const totalSpan = document.getElementById("totalCOP");
        const mesaBadge = document.getElementById("mesaBadge");
        mesaBadge.innerText = `Mesa ${currentMesa}`;
        
        const items = orders[currentMesa].items;
        if (Object.keys(items).length === 0) {
            cartDiv.innerHTML = '<div style="text-align:center;opacity:0.7;">Sin productos</div>';
            totalSpan.innerText = "$0 COP";
            return;
        }
        
        let total = 0;
        let html = "";
        for (let [nombre, det] of Object.entries(items)) {
            const subtotal = det.cantidad * det.precio;
            total += subtotal;
            html += `
                <div class="cart-item-row">
                    <span style="flex:2; font-size:0.8rem;">${nombre} x${det.cantidad}</span>
                    <div class="cart-controls-group">
                        <button data-nombre="${nombre}" data-op="sumar">+</button>
                        <button data-nombre="${nombre}" data-op="restar">-</button>
                        <button data-nombre="${nombre}" data-op="eliminar" style="background:#c0392b;">🗑️</button>
                    </div>
                    <span>$${subtotal.toLocaleString()}</span>
                </div>
            `;
        }
        cartDiv.innerHTML = html;
        totalSpan.innerText = `$${total.toLocaleString()} COP`;

        document.querySelectorAll(".cart-controls-group button").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const nombre = btn.dataset.nombre;
                const op = btn.dataset.op;
                if (op === "sumar") orders[currentMesa].items[nombre].cantidad++;
                else if (op === "restar") {
                    if (orders[currentMesa].items[nombre].cantidad > 1) orders[currentMesa].items[nombre].cantidad--;
                    else delete orders[currentMesa].items[nombre];
                } else if (op === "eliminar") delete orders[currentMesa].items[nombre];
                renderCart();
            });
        });
    }

    // Envío a Telegram
    async function enviarATelegram(mensaje) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: mensaje, parse_mode: 'Markdown' })
            });
            const data = await res.json();
            return data.ok;
        } catch (e) {
            return false;
        }
    }

    function mostrarLoadingYEnviar() {
        const pedido = orders[currentMesa];
        if (Object.keys(pedido.items).length === 0) {
            mostrarToast("⚠️ Agrega productos primero", "#e67e22");
            return;
        }
        if (!pedido.cliente.trim()) {
            mostrarToast("✏️ Ingresa el nombre del cliente", "#e67e22");
            return;
        }

        let detalle = "";
        let total = 0;
        for (let [nom, det] of Object.entries(pedido.items)) {
            const subtotal = det.cantidad * det.precio;
            total += subtotal;
            detalle += `🍽️ *${nom}* x${det.cantidad} = $${subtotal.toLocaleString()} COP\n`;
        }
        
        const mensaje = `🧾 *NUEVO PEDIDO RAPPI ÁRABE*\n━━━━━━━━━━━━━━━━━━━━━\n👤 *Cliente:* ${pedido.cliente}\n🪑 *Mesa:* ${currentMesa}\n⏰ *Hora:* ${new Date().toLocaleTimeString()}\n\n📋 *DETALLE:*\n${detalle}\n━━━━━━━━━━━━━━━━━━━━━\n💰 *TOTAL:* $${total.toLocaleString()} COP\n✅ *Estado:* En preparación`;

        // Mostrar dots loading
        const loader = document.createElement("div");
        loader.style.position = "fixed";
        loader.style.top = "0";
        loader.style.left = "0";
        loader.style.width = "100%";
        loader.style.height = "100%";
        loader.style.background = "rgba(0,0,0,0.9)";
        loader.style.backdropFilter = "blur(8px)";
        loader.style.display = "flex";
        loader.style.flexDirection = "column";
        loader.style.alignItems = "center";
        loader.style.justifyContent = "center";
        loader.style.zIndex = "4000";
        loader.innerHTML = `
            <div style="background:#1f3b2c; border-radius: 60px; padding: 40px; text-align:center;">
                <div style="font-size: 3rem;">🍢</div>
                <div class="dots-loader" style="margin: 20px 0;"><span></span><span></span><span></span></div>
                <p style="color:white; font-weight:bold;">Enviando pedido a cocina...</p>
            </div>
        `;
        document.body.appendChild(loader);
        
        // 3.5 segundos de loading
        setTimeout(async () => {
            const exito = await enviarATelegram(mensaje);
            loader.remove();
            if (exito) {
                mostrarToast("✅ Pedido enviado exitosamente a cocina", "#2ecc71");
                // LIMPIAR PEDIDO ACTUAL
                orders[currentMesa] = { items: {}, cliente: pedido.cliente };
                document.getElementById("nombreCliente").value = pedido.cliente;
                renderCart();
                // Cerrar carrito automáticamente
                document.getElementById("cartPanel").classList.remove("open");
            } else {
                mostrarToast("❌ Error al enviar a Telegram", "#e74c3c");
            }
        }, 3500);
    }

    function mostrarToast(msg, color) {
        const toast = document.createElement("div");
        toast.className = "toast-message";
        toast.innerText = msg;
        toast.style.background = color;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // Inicializar eventos
    function init() {
        renderMenu();
        renderCart();
        
        // Selector de mesa
        const mesaSelect = document.getElementById("mesaSelect");
        mesaSelect.addEventListener("change", (e) => {
            // Guardar cliente actual antes de cambiar
            orders[currentMesa].cliente = document.getElementById("nombreCliente").value;
            currentMesa = parseInt(e.target.value);
            document.getElementById("nombreCliente").value = orders[currentMesa].cliente || "";
            renderCart();
        });
        
        // Input cliente
        document.getElementById("nombreCliente").addEventListener("input", (e) => {
            orders[currentMesa].cliente = e.target.value;
        });
        
        // Toggle carrito
        document.getElementById("toggleCartBtn").addEventListener("click", () => {
            document.getElementById("cartPanel").classList.toggle("open");
        });
        
        // Botón enviar
        document.getElementById("sendOrderTrigger").addEventListener("click", mostrarLoadingYEnviar);
        
        // Modal acompañante
        const modal = document.getElementById("modalAcompanante");
        document.querySelectorAll(".opcion-acompanante").forEach(opt => {
            opt.addEventListener("click", () => {
                modal.style.display = "none";
                if (pendingPincho) {
                    const acompanante = opt.dataset.acompanante;
                    agregarProducto(pendingPincho.nombre, pendingPincho.precio, acompanante);
                    pendingPincho = null;
                }
            });
        });
        
        // Cerrar modal tocando fuera
        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
                pendingPincho = null;
            }
        });
    }
    
    // Botón deslizante inicial
    function initEntrySlide() {
        const wrapper = document.getElementById("entrySlide");
        let startX = 0, isDragging = false;
        const onMove = (e) => {
            if (!isDragging) return;
            const diff = (e.clientX || e.touches[0].clientX) - startX;
            if (diff > 70) {
                isDragging = false;
                document.getElementById("loadingScreen").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("loadingScreen").style.display = "none";
                    document.getElementById("meseroPanel").style.display = "block";
                    init();
                }, 400);
            }
        };
        wrapper.addEventListener("mousedown", (e) => { startX = e.clientX; isDragging = true; });
        wrapper.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; isDragging = true; });
        window.addEventListener("mousemove", onMove);
        window.addEventListener("touchmove", onMove);
        window.addEventListener("mouseup", () => isDragging = false);
        window.addEventListener("touchend", () => isDragging = false);
    }
    
    initEntrySlide();
</script>
</body>
</html>
