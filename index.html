<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rappi Árabe | Sistema Profesional Mesero</title>
    <style>
        /* ========== RESET Y ESTILOS GLOBALES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d3 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== PANTALLA DE CARGA INICIAL ========== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c1a 0%, #1a0f0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 0.6s ease;
        }

        .logo-circle {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #FFD700, #FF8C00, #FF4500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: pulseGlow 2s ease-in-out infinite, floatLogo 3s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(255,215,0,0.4);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,0.4); transform: scale(1); }
            50% { box-shadow: 0 0 45px rgba(255,215,0,0.7); transform: scale(1.02); }
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo-circle span { font-size: 4.5rem; }

        .loading-title { text-align: center; margin-top: 10px; animation: fadeInUp 0.8s ease; }
        .loading-title h2 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #FFD700, #FF8C00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .loading-title p { color: rgba(255,215,0,0.8); font-size: 0.8rem; margin-top: 5px; letter-spacing: 2px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .dots-loader { display: flex; gap: 14px; margin: 40px 0 50px; }
        .dots-loader span { width: 14px; height: 14px; background: linear-gradient(135deg, #FFD700, #FF8C00); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dots-loader span:nth-child(2) { animation-delay: 0.15s; }
        .dots-loader span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; } 40% { transform: scale(1.2); opacity: 1; } }

        .slide-btn-wrapper { width: 300px; background: rgba(255,255,255,0.1); border-radius: 70px; padding: 4px; backdrop-filter: blur(12px); border: 1px solid rgba(255,215,0,0.4); cursor: pointer; }
        .slide-btn { background: linear-gradient(90deg, #FFD700, #FF8C00); border-radius: 70px; display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; font-weight: 800; color: #1a1a2e; user-select: none; }

        /* ========== PANEL PRINCIPAL ========== */
        .mesero-panel { display: none; min-height: 100vh; background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d3 100%); padding-bottom: 85px; animation: fadeSlide 0.5s ease; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ========== INDICADOR PULL TO REFRESH (SUPER RÁPIDO) ========== */
        .refresh-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            margin-top: -45px;
            transition: margin-top 0.1s ease;
            background: transparent;
            height: 45px;
        }
        .refresh-indicator.active { margin-top: 0; }
        .refresh-dots { display: flex; gap: 8px; }
        .refresh-dots span { width: 8px; height: 8px; background: linear-gradient(135deg, #FFD700, #FF8C00); border-radius: 50%; animation: refreshBounce 0.5s infinite ease-in-out; }
        .refresh-dots span:nth-child(2) { animation-delay: 0.1s; }
        .refresh-dots span:nth-child(3) { animation-delay: 0.2s; }
        @keyframes refreshBounce { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        /* ========== HEADER SUPERIOR ========== */
        .header-glass { background: rgba(30, 58, 47, 0.92); backdrop-filter: blur(20px); padding: 16px 20px 20px; color: white; border-radius: 0 0 32px 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); border-bottom: 1px solid rgba(255,215,0,0.3); }
        .header-glass h2 { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .selector-compact { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .mesa-dropdown-glass { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255,215,0,0.4); padding: 12px 16px; border-radius: 40px; font-weight: 600; font-size: 0.95rem; color: white; cursor: pointer; flex: 1; min-width: 120px; }
        .mesa-dropdown-glass option { background: #1e3a2f; color: white; }
        .cliente-input-glass { flex: 2; min-width: 170px; }
        .cliente-input-glass input { width: 100%; padding: 12px 16px; border-radius: 40px; border: none; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); color: white; font-size: 0.9rem; }
        .cliente-input-glass input::placeholder { color: rgba(255,255,255,0.7); }
        .cliente-input-glass input:focus { outline: none; background: rgba(255,255,255,0.3); }

        /* ========== MENÚ DE PRODUCTOS ========== */
        .menu-scroll { padding: 20px 16px; max-height: calc(100vh - 280px); overflow-y: auto; }
        .categoria-tag { font-size: 1.2rem; font-weight: 800; background: rgba(255,232,197,0.95); backdrop-filter: blur(10px); display: inline-block; padding: 6px 18px; border-radius: 40px; margin-bottom: 14px; color: #4a2e1a; }
        .item-card { background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border-radius: 24px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(255,226,181,0.5); transition: all 0.2s; }
        .item-card:active { transform: scale(0.98); }
        .item-info h4 { font-size: 0.95rem; font-weight: 700; color: #2c1810; }
        .precio { color: #e67e22; font-weight: 800; font-size: 0.85rem; margin-top: 4px; }
        .add-btn { background: linear-gradient(135deg, #FFD700, #FF8C00); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: 0.1s; }
        .add-btn:active { transform: scale(0.92); }

        /* ========== BARRA INFERIOR FIJA ========== */
        .bottom-bar-glass { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(26, 42, 34, 0.96); backdrop-filter: blur(20px); border-radius: 28px 28px 0 0; padding: 14px 20px 20px; color: white; z-index: 100; box-shadow: 0 -8px 25px rgba(0,0,0,0.15); border-top: 1px solid rgba(255,215,0,0.3); }
        .send-slide-container { background: rgba(255,255,255,0.12); border-radius: 60px; padding: 4px; margin-bottom: 12px; cursor: pointer; }
        .send-slide-track { background: linear-gradient(90deg, #FFD700, #FF8C00); border-radius: 60px; display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; font-weight: 800; color: #1a2a22; user-select: none; transition: transform 0.05s linear; }
        .arrow-toggle-glass { background: rgba(255,255,255,0.1); border: none; width: 100%; padding: 10px; border-radius: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: #FFD700; font-weight: 600; font-size: 0.9rem; transition: 0.1s; }
        .arrow-toggle-glass:active { transform: scale(0.97); }

        /* ========== CARRITO DESPLEGABLE ========== */
        .cart-slide-glass { position: fixed; bottom: 85px; left: 0; right: 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(20px); border-radius: 28px 28px 0 0; padding: 20px; max-height: 55vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease; z-index: 99; box-shadow: 0 -8px 30px rgba(0,0,0,0.1); border-top: 2px solid #FFD700; }
        .cart-slide-glass.open { transform: translateY(0); }
        .cart-header-glass { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1rem; margin-bottom: 12px; color: #1a2a22; padding-bottom: 8px; border-bottom: 2px solid #FFD700; }
        .total-badge { background: linear-gradient(135deg, #FFD700, #FF8C00); padding: 5px 15px; border-radius: 30px; color: #1a2a22; font-size: 0.8rem; font-weight: bold; }
        .cart-items-list { max-height: 240px; overflow-y: auto; margin-bottom: 12px; }
        .cart-item-row { background: rgba(245,243,240,0.9); border-radius: 20px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; flex-wrap: wrap; gap: 8px; }
        .cart-controls { display: flex; gap: 10px; align-items: center; }
        .cart-controls button { background: #FFB347; border: none; width: 32px; height: 32px; border-radius: 30px; font-weight: bold; cursor: pointer; color: #1a2a22; transition: 0.1s; }
        .cart-controls button:active { transform: scale(0.92); }
        .cart-controls button:last-child { background: #c0392b; color: white; }
        .total-glass { font-size: 1.6rem; font-weight: 900; text-align: right; border-top: 2px solid #FFD700; padding-top: 12px; margin-top: 8px; background: linear-gradient(135deg, #e67e22, #d35400); -webkit-background-clip: text; background-clip: text; color: transparent; }

        /* ========== MODALES ========== */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-card-glass { background: rgba(255,255,255,0.96); backdrop-filter: blur(20px); border-radius: 48px; padding: 32px 24px; width: 85%; max-width: 340px; text-align: center; animation: modalPop 0.3s ease; border: 1px solid rgba(255,215,0,0.5); }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-card-glass h3 { font-size: 1.5rem; margin-bottom: 20px; color: #1e3a2f; }
        .opcion-acompanante { background: rgba(240,237,232,0.95); padding: 14px; margin: 12px 0; border-radius: 60px; cursor: pointer; font-weight: bold; color: #2c1810; transition: 0.1s; }
        .opcion-acompanante:active { transform: scale(0.96); }

        /* ========== MENSAJES ========== */
        .success-didi { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); backdrop-filter: blur(20px); color: white; padding: 24px 36px; border-radius: 60px; text-align: center; z-index: 4000; animation: successAnim 0.3s ease; font-weight: 700; font-size: 1.1rem; border: 1px solid rgba(255,215,0,0.5); }
        @keyframes successAnim { from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .toast-msg { position: fixed; bottom: 120px; left: 20px; right: 20px; background: rgba(46,204,113,0.96); backdrop-filter: blur(10px); color: white; text-align: center; padding: 14px; border-radius: 60px; z-index: 3500; font-weight: bold; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- PANTALLA DE CARGA INICIAL -->
<div class="loading-screen" id="loadingScreen">
    <div class="logo-circle"><span>🍢</span></div>
    <div class="loading-title">
        <h2>RAPPI ÁRABE</h2>
        <p>COCINA DE AUTOR · SABORES DEL MEDITERRÁNEO</p>
    </div>
    <div class="dots-loader"><span></span><span></span><span></span></div>
    <div class="slide-btn-wrapper" id="entrySlide">
        <div class="slide-btn"><span>DESLIZA PARA INGRESAR →</span><span>➡️</span></div>
    </div>
</div>

<!-- PANEL PRINCIPAL MESERO -->
<div class="mesero-panel" id="meseroPanel">
    <!-- HEADER -->
    <div class="header-glass">
        <h2>🧾 RAPPI ÁRABE</h2>
        <div class="selector-compact">
            <select id="mesaSelect" class="mesa-dropdown-glass">
                <option value="1">📌 Mesa 1</option><option value="2">📌 Mesa 2</option>
                <option value="3">📌 Mesa 3</option><option value="4">📌 Mesa 4</option>
                <option value="5">📌 Mesa 5</option><option value="6">📌 Mesa 6</option>
            </select>
            <div class="cliente-input-glass">
                <input type="text" id="nombreCliente" placeholder="👤 Nombre del cliente" autocomplete="off">
            </div>
        </div>
    </div>

    <!-- INDICADOR PULL TO REFRESH -->
    <div class="refresh-indicator" id="refreshIndicator">
        <div class="refresh-dots"><span></span><span></span><span></span></div>
    </div>

    <!-- MENÚ DE PRODUCTOS -->
    <div class="menu-scroll" id="menuContainer"></div>

    <!-- BARRA INFERIOR -->
    <div class="bottom-bar-glass">
        <div class="send-slide-container" id="sendSlideWrapper">
            <div class="send-slide-track" id="sendSlideTrack">
                <span>📨 DESLIZA PARA ENVIAR →</span><span>👉</span>
            </div>
        </div>
        <button class="arrow-toggle-glass" id="arrowToggleBtn">
            <span>⬆️</span> VER PEDIDO ACTUAL <span>⬆️</span>
        </button>
    </div>

    <!-- CARRITO DESPLEGABLE -->
    <div class="cart-slide-glass" id="cartSlidePanel">
        <div class="cart-header-glass">
            <span>🛒 PEDIDO ACTUAL</span>
            <span class="total-badge" id="mesaBadge">Mesa 1</span>
        </div>
        <div id="cartItemsList" class="cart-items-list"></div>
        <div class="total-glass" id="totalCOP">$0 COP</div>
    </div>
</div>

<!-- MODAL ACOMPAÑANTE PARA PINCHOS -->
<div class="modal-overlay" id="modalAcompanante">
    <div class="modal-card-glass">
        <h3>🍢 ¿CON QUÉ LO QUIERES?</h3>
        <div class="opcion-acompanante" data-acompanante="papas">🍟 Papas Francesas</div>
        <div class="opcion-acompanante" data-acompanante="tahine">🥙 Tahine + Pan Árabe</div>
    </div>
</div>

<!-- MODAL ENCARGADAS -->
<div class="modal-overlay" id="modalEncargada">
    <div class="modal-card-glass">
        <h3>👩‍🍳 ¿QUIÉN ATIENDE?</h3>
        <div class="opcion-acompanante" data-encargada="Paula">👩🏻 PAULA</div>
        <div class="opcion-acompanante" data-encargada="Cindy">👩🏽 CINDY</div>
    </div>
</div>

<script>
    // ========== CONFIGURACIÓN TELEGRAM ==========
    const TELEGRAM_BOT_TOKEN = "8985589315:AAEnWzP5f2YwSI7dW_gylgtI4pHDZVnkMD8";
    const TELEGRAM_CHAT_ID = "7806030847";

    // ========== MENÚ COMPLETO ==========
    const menuData = {
        "PLATOS PRINCIPALES": [
            { nombre: "Quibbe", precio: 3000 },
            { nombre: "Combo Quibbe", precio: 12000 },
            { nombre: "Combo Deditos", precio: 12000 },
            { nombre: "Combo Carimañolas", precio: 12000 },
            { nombre: "Bandeja de Quibbe", precio: 26000 },
            { nombre: "Trio Rapiárabe", precio: 30000 }
        ],
        "ESPECIALIDADES": [
            { nombre: "Tahine Especial", precio: 18000 },
            { nombre: "Tahine Especial de Pollo", precio: 16000 },
            { nombre: "Tahine TOGO", precio: 10000 }
        ],
        "PINCHOS": [
            { nombre: "Pincho de Pollo", precio: 22000 },
            { nombre: "Pincho de Lomo Fino", precio: 28000 },
            { nombre: "Pincho de Bondiola de Cerdo", precio: 25000 },
            { nombre: "Pincho Mixto", precio: 26000 }
        ],
        "CONGELADOS": [
            { nombre: "Paquete de Quibbe Congelado", precio: 20000 },
            { nombre: "Bandeja de Deditos de Queso Congelado", precio: 15000 },
            { nombre: "Bandeja de Carimañola Congelado", precio: 15000 }
        ]
    };

    // ========== ESTADO DE LA APLICACIÓN ==========
    let orders = {};
    for (let i = 1; i <= 6; i++) orders[i] = { items: {}, cliente: "" };
    let currentMesa = 1;
    let pendingPincho = null;

    // ========== FUNCIÓN PULL TO REFRESH (SUPER RÁPIDA) ==========
    let touchStartY = 0;
    let isRefreshing = false;
    const refreshIndicator = document.getElementById('refreshIndicator');
    const scrollContainer = document.getElementById('menuContainer');

    function actualizarSistemaRapido() {
        if (isRefreshing) return;
        isRefreshing = true;
        refreshIndicator.classList.add('active');
        
        // Recargar el menú (rápido)
        renderMenu();
        // Recargar el carrito
        renderCart();
        
        // Ocultar indicador después de 300ms (SUPER RÁPIDO)
        setTimeout(() => {
            refreshIndicator.classList.remove('active');
            isRefreshing = false;
            mostrarToast("✅ Sistema actualizado", "#2ecc71");
        }, 300);
    }

    function initPullToRefresh() {
        if (!scrollContainer) return;
        
        scrollContainer.addEventListener('touchstart', (e) => {
            if (scrollContainer.scrollTop === 0) {
                touchStartY = e.touches[0].clientY;
            }
        });
        
        scrollContainer.addEventListener('touchmove', (e) => {
            if (scrollContainer.scrollTop === 0 && !isRefreshing) {
                const currentY = e.touches[0].clientY;
                const diff = currentY - touchStartY;
                if (diff > 50) {
                    e.preventDefault();
                    actualizarSistemaRapido();
                }
            }
        });
    }

    // ========== FUNCIONES DEL MENÚ ==========
    function renderMenu() {
        const container = document.getElementById("menuContainer");
        if (!container) return;
        let html = "";
        for (let [cat, items] of Object.entries(menuData)) {
            html += `<div><div class="categoria-tag">${cat}</div>`;
            items.forEach(item => {
                html += `
                    <div class="item-card">
                        <div class="item-info">
                            <h4>${item.nombre}</h4>
                            <div class="precio">$${item.precio.toLocaleString()} COP</div>
                        </div>
                        <div class="add-btn" data-nombre="${item.nombre}" data-precio="${item.precio}" data-categoria="${cat}">+</div>
                    </div>
                `;
            });
            html += `</div>`;
        }
        container.innerHTML = html;
        
        document.querySelectorAll(".add-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const nombre = btn.dataset.nombre;
                const precio = parseInt(btn.dataset.precio);
                const categoria = btn.dataset.categoria;
                if (categoria === "PINCHOS") {
                    pendingPincho = { nombre, precio };
                    document.getElementById("modalAcompanante").style.display = "flex";
                } else {
                    agregarProducto(nombre, precio, null);
                }
            });
        });
    }

    function agregarProducto(nombre, precio, acompanante) {
        let nombreFinal = nombre;
        if (acompanante) {
            nombreFinal = `${nombre} + ${acompanante === 'papas' ? '🍟 Papas Francesas' : '🥙 Tahine + Pan Árabe'}`;
        }
        if (!orders[currentMesa].items[nombreFinal]) {
            orders[currentMesa].items[nombreFinal] = { cantidad: 0, precio: precio };
        }
        orders[currentMesa].items[nombreFinal].cantidad++;
        if (document.getElementById("nombreCliente").value.trim()) {
            orders[currentMesa].cliente = document.getElementById("nombreCliente").value.trim();
        }
        renderCart();
        mostrarToast(`✅ ${nombreFinal} agregado`, "#2ecc71");
    }

    function renderCart() {
        const cartDiv = document.getElementById("cartItemsList");
        const totalSpan = document.getElementById("totalCOP");
        const mesaBadge = document.getElementById("mesaBadge");
        if (!cartDiv) return;
        
        mesaBadge.innerText = `Mesa ${currentMesa}`;
        const items = orders[currentMesa].items;
        
        if (Object.keys(items).length === 0) {
            cartDiv.innerHTML = '<div style="text-align:center;opacity:0.6; padding:20px;">🍽️ Sin productos seleccionados</div>';
            totalSpan.innerHTML = "$0 COP";
            return;
        }
        
        let total = 0;
        let html = "";
        for (let [nombre, det] of Object.entries(items)) {
            const subtotal = det.cantidad * det.precio;
            total += subtotal;
            html += `
                <div class="cart-item-row">
                    <span style="flex:2; font-size:0.8rem; font-weight:500;">${nombre} <span style="color:#e67e22;">x${det.cantidad}</span></span>
                    <div class="cart-controls">
                        <button data-nombre="${nombre}" data-op="sumar">+</button>
                        <button data-nombre="${nombre}" data-op="restar">-</button>
                        <button data-nombre="${nombre}" data-op="eliminar">🗑️</button>
                    </div>
                    <span style="font-weight:700; color:#e67e22;">$${subtotal.toLocaleString()}</span>
                </div>
            `;
        }
        cartDiv.innerHTML = html;
        totalSpan.innerHTML = `💰 ${total.toLocaleString()} COP`;

        document.querySelectorAll(".cart-controls button").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const nombre = btn.dataset.nombre;
                const op = btn.dataset.op;
                if (op === "sumar") orders[currentMesa].items[nombre].cantidad++;
                else if (op === "restar") {
                    if (orders[currentMesa].items[nombre].cantidad > 1) orders[currentMesa].items[nombre].cantidad--;
                    else delete orders[currentMesa].items[nombre];
                } else if (op === "eliminar") delete orders[currentMesa].items[nombre];
                renderCart();
            });
        });
    }

    // ========== FUNCIONES DE TELEGRAM ==========
    async function enviarATelegram(mensaje) {
        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: mensaje, parse_mode: 'Markdown' })
            });
            const data = await res.json();
            return data.ok;
        } catch (e) {
            return false;
        }
    }

    function mostrarExitoDidi() {
        const div = document.createElement("div");
        div.className = "success-didi";
        div.innerHTML = "✅ ¡PEDIDO ENVIADO!<br><span style='font-size:0.75rem;'>Cocina en preparación</span>";
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2500);
    }

    function mostrarToast(msg, color) {
        const toast = document.createElement("div");
        toast.className = "toast-msg";
        toast.innerText = msg;
        toast.style.background = color;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function limpiarPedidoActual() {
        orders[currentMesa] = { items: {}, cliente: orders[currentMesa].cliente || "" };
        renderCart();
        const cartPanel = document.getElementById("cartSlidePanel");
        const arrowBtn = document.getElementById("arrowToggleBtn");
        if (cartPanel) cartPanel.classList.remove("open");
        if (arrowBtn) arrowBtn.innerHTML = "<span>⬆️</span> VER PEDIDO ACTUAL <span>⬆️</span>";
    }

    function enviarPedidoConEncargada(encargada) {
        const pedido = orders[currentMesa];
        let detalle = "";
        let total = 0;
        for (let [nom, det] of Object.entries(pedido.items)) {
            const subtotal = det.cantidad * det.precio;
            total += subtotal;
            detalle += `🍽️ *${nom}* x${det.cantidad} = $${subtotal.toLocaleString()} COP\n`;
        }
        
        const mensaje = `🧾 *NUEVO PEDIDO RAPPI ÁRABE*\n━━━━━━━━━━━━━━━━━━━━━\n👩‍🍳 *Encargada:* ${encargada}\n👤 *Cliente:* ${pedido.cliente}\n🪑 *Mesa:* ${currentMesa}\n⏰ *Hora:* ${new Date().toLocaleTimeString()}\n\n📋 *DETALLE:*\n${detalle}\n━━━━━━━━━━━━━━━━━━━━━\n💰 *TOTAL:* $${total.toLocaleString()} COP\n✅ *Estado:* En preparación`;

        // Mostrar loading
        const loader = document.createElement("div");
        loader.style.position = "fixed";
        loader.style.top = "0";
        loader.style.left = "0";
        loader.style.width = "100%";
        loader.style.height = "100%";
        loader.style.background = "rgba(0,0,0,0.85)";
        loader.style.backdropFilter = "blur(12px)";
        loader.style.display = "flex";
        loader.style.flexDirection = "column";
        loader.style.alignItems = "center";
        loader.style.justifyContent = "center";
        loader.style.zIndex = "4000";
        loader.innerHTML = `
            <div style="background:rgba(30,58,47,0.95); border-radius: 60px; padding: 40px; text-align:center;">
                <div style="font-size: 3rem;">🍢</div>
                <div class="dots-loader" style="margin: 20px 0;"><span></span><span></span><span></span></div>
                <p style="color:white; font-weight:bold;">Enviando a cocina...</p>
            </div>
        `;
        document.body.appendChild(loader);
        
        setTimeout(async () => {
            const exito = await enviarATelegram(mensaje);
            loader.remove();
            if (exito) {
                mostrarExitoDidi();
                limpiarPedidoActual();
            } else {
                mostrarToast("❌ Error al enviar a Telegram", "#e74c3c");
            }
        }, 3500);
    }

    // ========== INICIALIZACIÓN ==========
    function init() {
        renderMenu();
        renderCart();
        initPullToRefresh();
        
        const mesaSelect = document.getElementById("mesaSelect");
        mesaSelect.addEventListener("change", (e) => {
            orders[currentMesa].cliente = document.getElementById("nombreCliente").value;
            currentMesa = parseInt(e.target.value);
            document.getElementById("nombreCliente").value = orders[currentMesa]?.cliente || "";
            renderCart();
            document.getElementById("mesaBadge").innerText = `Mesa ${currentMesa}`;
        });
        
        document.getElementById("nombreCliente").addEventListener("input", (e) => {
            orders[currentMesa].cliente = e.target.value;
        });
        
        const arrowBtn = document.getElementById("arrowToggleBtn");
        const cartPanel = document.getElementById("cartSlidePanel");
        arrowBtn.addEventListener("click", () => {
            cartPanel.classList.toggle("open");
            arrowBtn.innerHTML = cartPanel.classList.contains("open") 
                ? "<span>⬇️</span> OCULTAR PEDIDO <span>⬇️</span>" 
                : "<span>⬆️</span> VER PEDIDO ACTUAL <span>⬆️</span>";
        });
        
        // Botón deslizable enviar
        const sendWrapper = document.getElementById("sendSlideWrapper");
        const sendTrack = document.getElementById("sendSlideTrack");
        let startX = 0, isDragging = false;
        const resetSlide = () => { sendTrack.style.transform = "translateX(0)"; };
        const handleMove = (clientX) => {
            if (!isDragging) return;
            const diff = clientX - startX;
            if (diff > 80) {
                isDragging = false;
                resetSlide();
                const pedido = orders[currentMesa];
                if (Object.keys(pedido.items).length === 0) {
                    mostrarToast("⚠️ Agrega productos primero", "#e67e22");
                    return;
                }
                if (!pedido.cliente.trim()) {
                    mostrarToast("✏️ Ingresa el nombre del cliente", "#e67e22");
                    return;
                }
                document.getElementById("modalEncargada").style.display = "flex";
            } else if (diff > 0) {
                sendTrack.style.transform = `translateX(${Math.min(diff, 80)}px)`;
            }
        };
        sendWrapper.addEventListener("mousedown", (e) => { startX = e.clientX; isDragging = true; e.preventDefault(); });
        sendWrapper.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; isDragging = true; });
        window.addEventListener("mousemove", (e) => { if (isDragging) handleMove(e.clientX); });
        window.addEventListener("touchmove", (e) => { if (isDragging) handleMove(e.touches[0].clientX); });
        window.addEventListener("mouseup", () => { if (isDragging) resetSlide(); isDragging = false; });
        window.addEventListener("touchend", () => { if (isDragging) resetSlide(); isDragging = false; });
        
        // Modales
        const modalEnc = document.getElementById("modalEncargada");
        document.querySelectorAll("#modalEncargada .opcion-acompanante").forEach(opt => {
            opt.addEventListener("click", () => {
                modalEnc.style.display = "none";
                enviarPedidoConEncargada(opt.dataset.encargada);
            });
        });
        modalEnc.addEventListener("click", (e) => { if (e.target === modalEnc) modalEnc.style.display = "none"; });
        
        const modalAcomp = document.getElementById("modalAcompanante");
        document.querySelectorAll("#modalAcompanante .opcion-acompanante").forEach(opt => {
            opt.addEventListener("click", () => {
                modalAcomp.style.display = "none";
                if (pendingPincho) {
                    agregarProducto(pendingPincho.nombre, pendingPincho.precio, opt.dataset.acompanante);
                    pendingPincho = null;
                }
            });
        });
        modalAcomp.addEventListener("click", (e) => { if (e.target === modalAcomp) { modalAcomp.style.display = "none"; pendingPincho = null; } });
    }
    
    // Entrada deslizante
    function initEntrySlide() {
        const wrapper = document.getElementById("entrySlide");
        let startX = 0, isDragging = false;
        const onMove = (e) => {
            if (!isDragging) return;
            const diff = (e.clientX || e.touches[0].clientX) - startX;
            if (diff > 70) {
                isDragging = false;
                document.getElementById("loadingScreen").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("loadingScreen").style.display = "none";
                    document.getElementById("meseroPanel").style.display = "block";
                    init();
                }, 400);
            }
        };
        wrapper.addEventListener("mousedown", (e) => { startX = e.clientX; isDragging = true; });
        wrapper.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; isDragging = true; });
        window.addEventListener("mousemove", onMove);
        window.addEventListener("touchmove", onMove);
        window.addEventListener("mouseup", () => isDragging = false);
        window.addEventListener("touchend", () => isDragging = false);
    }
    
    initEntrySlide();
</script>
</body>
</html>
